# Collection targets, sourced from University_Job_Search_Map.xlsx.
#
# platform: workday | peopleadmin | pageup | umn
#
# workday keys:      host, tenant, site, multi_institution?, fetch_detail?
# peopleadmin keys:  base_url, default_location?
# pageup keys:       host
#
# `enabled: false` skips a target without deleting the config.
# Adding a school is a config change, not a code change.

targets:

  # ==================== WORKDAY -- verified live 2026-07-28 ==================

  - name: Minnesota State (33 colleges & universities)
    platform: workday
    system: Minnesota State
    state: MN
    host: https://minnstate.wd115.myworkdayjobs.com
    tenant: minnstate
    site: Minnesota_State_Careers
    multi_institution: true      # real employer arrives in bulletFields
    notes: 184 postings at last check. Includes the System Office central IT shop.

  - name: Universities of Wisconsin (12 campuses)
    platform: workday
    system: Universities of Wisconsin
    state: WI
    host: https://wisconsin.wd1.myworkdayjobs.com
    tenant: wisconsin
    site: UW_Comprehensives
    multi_institution: true
    notes: 354 postings at last check. Milwaukee, Eau Claire, La Crosse, Stout, etc.

